[project]
name = "shopify-admin"
version = "0.1.0"
description = "Shopify 店铺管理系统 — REST API + MCP 双入口，全功能接口化"
requires-python = ">=3.11"
dependencies = [
    "bmai",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "apscheduler>=3.10",
    "mcp>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopify_admin"]

# bmai 以本地 editable 依赖复用（CS 供应商客户端/同步/履约路由）
[tool.uv.sources]
bmai = { path = "E:/worksapce/BMAI", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
